<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>???</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            cursor: pointer;
        }

        .screamer-content {
            display: none;
            text-align: center;
        }

        .face-img {
            width: 160px;
            height: auto;
            border: none;
            display: block;
            margin: 0 auto;
        }

        .jp-text {
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            margin-top: 5px;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>

    <!-- Одиночный звук -->
    <audio id="beep-sound" src="beep.mp3" preload="auto"></audio>

    <div class="screamer-content" id="screamer">
        <img src="face.jpg" alt="STOP" class="face-img">
        <div class="jp-text">やめろ</div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            var sound = document.getElementById('beep-sound');
            var screamer = document.getElementById('screamer');
            var hasPlayed = false;

            function playAudio() {
                if (hasPlayed) return;
                sound.volume = 0.5;
                sound.play().then(function() {
                    hasPlayed = true;
                }).catch(function(error) {
                    console.log("Автовоспроизведение заблокировано браузером, ожидаем клика...");
                });
            }

            // Показываем контент через 2 секунды
            setTimeout(function() {
                screamer.style.display = 'block';
                playAudio();
            }, 2000);

            // Резервный вариант: если браузер заблокировал автозвук,
            // звук проиграется при любом клике или нажатии клавиши
            document.addEventListener('click', playAudio);
            document.addEventListener('keydown', playAudio);
        });
    </script>

</body>
</html>
