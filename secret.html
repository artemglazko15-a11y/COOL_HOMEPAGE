<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>???</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Контейнер скримера (скрыт по умолчанию) */
        .screamer-content {
            display: none;
            text-align: center;
        }

        /* Маленькая картинка без рамок */
        .face-img {
            width: 160px;
            height: auto;
            border: none;
            display: block;
            margin: 0 auto;
        }

        /* Белый текст прямо под лицом */
        .jp-text {
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            margin-top: 5px;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>

    <!-- Контент -->
    <div class="screamer-content" id="screamer">
        <img src="face.jpg" alt="STOP" class="face-img">
        <div class="jp-text">やめろ</div>
    </div>

    <!-- Скрипт задержки (2 секунды черного экрана) -->
    <script>
        window.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                var screamer = document.getElementById('screamer');
                screamer.style.display = 'block';
            }, 2000);
        });
    </script>

</body>
</html>
