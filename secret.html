<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>???</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .screamer-content {
            display: none;
            text-align: center;
        }

        .face-img {
            width: 160px;
            height: auto;
            border: none;
            display: block;
            margin: 0 auto;
        }

        .jp-text {
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            margin-top: 5px;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>

    <!-- Одиночный звук без повторов -->
    <audio id="beep-sound" src="beep.mp3" preload="auto"></audio>

    <div class="screamer-content" id="screamer">
        <img src="face.jpg" alt="STOP" class="face-img">
        <div class="jp-text">やめろ</div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                var screamer = document.getElementById('screamer');
                var sound = document.getElementById('beep-sound');
                
                // Показываем контент
                screamer.style.display = 'block';
                
                // Проигрываем beep.mp3 один раз
                sound.volume = 0.5;
                sound.play().catch(function(error) {
                    console.log("Автовоспроизведение заблокировано браузером:", error);
                });
            }, 2000);
        });
    </script>

</body>
</html>
