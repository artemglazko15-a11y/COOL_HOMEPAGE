
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>???</title>
    <style>
        body {
            background-color: #000000;
            color: #ff0000;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Контейнер скримера (скрыт по умолчанию) */
        .screamer-content {
            display: none;
            text-align: center;
        }

        /* Маленькое изображение по центру */
        .face-img {
            width: 160px;
            height: auto;
            border: 1px solid #330000;
            box-shadow: 0 0 10px #ff0000;
            display: block;
            margin: 0 auto;
        }

        /* Маленькая надпись под картинкой */
        .jp-text {
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
            letter-spacing: 4px;
            text-shadow: 1px 1px 5px #ff0000;
        }
    </style>
</head>
<body>

    <!-- Аудиофайл скримера -->
    <audio id="scream-sound" src="scream.mp3" preload="auto"></audio>

    <!-- Контент скримера -->
    <div class="screamer-content" id="screamer">
        <img src="face.jpg" alt="STOP" class="face-img">
        <div class="jp-text">やめろ</div>
    </div>

    <!-- Скрипт задержки и воспроизведения -->
    <script>
        window.addEventListener('DOMContentLoaded', function() {
            // Ждем ровно 2 секунды черного экрана
            setTimeout(function() {
                var screamer = document.getElementById('screamer');
                var sound = document.getElementById('scream-sound');
                
                // Показываем маленький элемент по центру
                screamer.style.display = 'block';
                
                // Запускаем звук
                sound.play().catch(function(error) {
                    console.log("Автовоспроизведение заблокировано браузером:", error);
                });
            }, 2000);
        });
    </script>

</body>
</html>
