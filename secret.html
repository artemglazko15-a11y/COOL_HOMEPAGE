<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>???</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .screamer-content {
            display: none;
            text-align: center;
        }

        .face-img {
            width: 160px;
            height: auto;
            border: none;
            display: block;
            margin: 0 auto;
        }

        .jp-text {
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            margin-top: 5px;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>

    <div class="screamer-content" id="screamer">
        <img src="face.jpg" alt="STOP" class="face-img">
        <div class="jp-text">やめろ</div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            // Ставим метку, что пользователь уже активировал скример
            localStorage.setItem('screamerTriggered', 'true');

            // 1. Ждем 2 секунды черного экрана перед показом
            setTimeout(function() {
                var screamer = document.getElementById('screamer');
                screamer.style.display = 'block';

                // 2. Ровно через 5 секунд после показа отправляем назад на index.html
                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 5000);

            }, 2000);
        });
    </script>

</body>
</html>
