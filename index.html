<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SUPER DUPER MEGA COOL PAGE</title>
    <style>
        /* Сброс отступов и черный фон страницы */
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            font-family: "Comic Sans MS", "Arial", sans-serif;
            color: #ffffff;
            text-align: center;
        }

        /* Красная бегущая строка на всю ширину без отступов */
        marquee.top-banner {
            background-color: #ff0000;
            color: #ffffff;
            font-weight: bold;
            font-size: 16px;
            padding: 6px 0;
            display: block;
            width: 100%;
            margin: 0;
        }

        /* Верхняя панель с кнопкой и заголовком */
        .header-bar {
            margin-top: 15px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
        }

        .btn-push {
            background-color: #00ff00;
            color: #000000;
            font-weight: bold;
            padding: 6px 12px;
            text-decoration: none;
            border: 2px outset #ffffff;
            font-size: 14px;
        }

        .btn-push:active {
            border-style: inset;
        }

        /* Анимация радужного перелива цветов (Web 1.0 стиль) */
        @keyframes rainbow-animation {
            0% { color: #ff00ff; }   /* Маджента */
            17% { color: #ff0000; }  /* Красный */
            33% { color: #ffff00; }  /* Желтый */
            50% { color: #00ff00; }  /* Зеленый */
            67% { color: #00ffff; }  /* Циан */
            83% { color: #0000ff; }  /* Синий */
            100% { color: #ff00ff; } /* Возврат к мадженте */
        }

        .site-title {
            /* Базовый цвет */
            color: #ff00ff; 
            font-weight: bold;
            font-size: 20px;
            /* Желтая тень для ретро-эффекта */
            text-shadow: 2px 2px 0px #ffff00; 
            /* Подключаем анимацию: имя, длительность, бесконечно, плавно */
            animation: rainbow-animation 3s infinite linear;
        }

        /* Серый классический окно-блок в центре */
        .main-box {
            background-color: #c0c0c0;
            color: #000000;
            width: 500px;
            max-width: 90%;
            margin: 40px auto 20px auto;
            padding: 30px 20px;
            border: 3px outset #ffffff;
            box-shadow: 5px 5px 0px #000000;
        }

        .main-box h1 {
            font-size: 22px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .main-box p {
            font-size: 14px;
            margin-bottom: 20px;
        }

        .btn-dont-click {
            background-color: #e0e0e0;
            border: 2px outset #ffffff;
            padding: 4px 10px;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-dont-click:active {
            border-style: inset;
        }

        /* Счетчик посетителей */
        .counter {
            margin-top: 25px;
            font-size: 16px;
            color: #ffffff;
        }

        .counter-number {
            color: #ffff00;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Бегущая строка во всю ширину -->
    <marquee class="top-banner" scrollamount="6">
        !!! ВНИМАНИЕ !!! ВЫ ВОШЛИ В СВЕРХСЕКРЕТНУЮ ЗОНУ АБСУРДА !!! ЛУЧШИЙ ПРОСМОТР В INTERNET EXPLORER 6.0 !!!
    </marquee>

    <!-- Шапка справа -->
    <div class="header-bar">
        <a href="player.html" class="btn-push">🖵 PUSH 4 VID!</a>
        <span class="site-title">*** SUPER DUPER MEGA COOL PAGE ***</span>
    </div>

    <!-- Центральный элемент Windows 95/98 -->
    <div class="main-box">
        <h1>ДОБРО ПОЖАЛОВАТЬ НА МОЮ ДОМАШНЮЮ СТРАНИЦУ!</h1>
        <p>Здесь ничего нет, но вы уже потратили 15 секунд своей жизни.</p>
        <button class="btn-dont-click" onclick="alert('Я же просил НЕ НАЖИМАТЬ!')">НЕ НАЖИМАТЬ!</button>
    </div>

    <!-- Счетчик -->
    <div class="counter">
        Счётчик посетителей: <span class="counter-number">00042069</span>
    </div>

</body>
</html>
