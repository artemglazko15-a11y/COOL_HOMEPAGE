<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SUPER DUPER MEGA COOL PAGE</title>
    <style>
        /* Сброс отступов и черный фон страницы */
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            font-family: "Comic Sans MS", "Arial", sans-serif;
            color: #ffffff;
            text-align: center;
            overflow-x: hidden;
        }

        /* Контейнер для бегущей строки */
        .marquee-container {
            background-color: #ff0000;
            color: #ffffff;
            font-weight: bold;
            font-size: 16px;
            padding: 6px 0;
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            display: flex;
        }

        /* Анимация движения слева направо (медленная) */
        @keyframes scroll-right {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(0%);
            }
        }

        .marquee-content {
            display: flex;
            white-space: nowrap;
            animation: scroll-right 25s linear infinite;
        }

        .marquee-text {
            padding-right: 50px;
            letter-spacing: 2px;
        }

        /* Глич-эффект для секретного знака */
        .glitch-mark {
            color: #00ffff;
            text-decoration: none;
            display: inline-block;
            font-weight: 900;
            position: relative;
            animation: glitch-anim 0.3s infinite alternate;
            cursor: pointer;
        }

        @keyframes glitch-anim {
            0% {
                transform: translate(0);
                text-shadow: -2px 0 #ff00ff, 2px 0 #00ffff;
            }
            25% {
                transform: translate(-2px, 2px);
                text-shadow: 2px -1px #ff0000, -2px 1px #00ff00;
            }
            50% {
                transform: translate(2px, -1px);
                text-shadow: -1px 2px #ffff00, 1px -2px #ff00ff;
            }
            75% {
                transform: translate(-1px, -2px);
                text-shadow: 2px 0 #00ffff, -2px 0 #ff0000;
            }
            100% {
                transform: translate(1px, 1px);
                text-shadow: -2px -2px #00ff00, 2px 2px #ffff00;
            }
        }

        /* Верхняя панель с заголовком */
        .header-bar {
            margin-top: 15px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 20px;
        }

        /* Анимация радужного перелива цветов (Web 1.0 стиль) */
        @keyframes rainbow-animation {
            0% { color: #ff00ff; }   /* Маджента */
            17% { color: #ff0000; }  /* Красный */
            33% { color: #ffff00; }  /* Желтый */
            50% { color: #00ff00; }  /* Зеленый */
            67% { color: #00ffff; }  /* Циан */
            83% { color: #0000ff; }  /* Синий */
            100% { color: #ff00ff; } /* Возврат к мадженте */
        }

        .site-title {
            color: #ff00ff; 
            font-weight: bold;
            font-size: 20px;
            text-shadow: 2px 2px 0px #ffff00; 
            animation: rainbow-animation 3s infinite linear;
        }

        /* Серый классический окно-блок в центре */
        .main-box {
            background-color: #c0c0c0;
            color: #000000;
            width: 500px;
            max-width: 90%;
            margin: 40px auto 20px auto;
            padding: 30px 20px;
            border: 3px outset #ffffff;
            box-shadow: 5px 5px 0px #000000;
        }

        .main-box h1 {
            font-size: 22px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .main-box p {
            font-size: 14px;
            margin-bottom: 20px;
        }

        .btn-dont-click {
            background-color: #e0e0e0;
            border: 2px outset #ffffff;
            padding: 4px 10px;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-dont-click:active {
            border-style: inset;
        }

        /* Счетчик посетителей */
        .counter {
            margin-top: 25px;
            font-size: 16px;
            color: #ffffff;
        }

        .counter-number {
            color: #ffff00;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Бегущая строка со сбойным знаком -->
    <div class="marquee-container">
        <div class="marquee-content">
            <div class="marquee-text">????? COOL PAGE ????? <a href="player.html" class="glitch-mark">?</a> ????? COOL PAGE ?????</div>
            <div class="marquee-text">????? COOL PAGE ????? <a href="player.html" class="glitch-mark">?</a> ????? COOL PAGE ?????</div>
        </div>
    </div>

    <!-- Шапка (кнопка убрана, оставлен только заголовок) -->
    <div class="header-bar">
        <span class="site-title">*** SUPER DUPER MEGA COOL PAGE ***</span>
    </div>

    <!-- Центральный элемент Windows 95/98 -->
    <div class="main-box">
        <h1>ДОБРО ПОЖАЛОВАТЬ НА МОЮ ДОМАШНЮЮ СТРАНИЦУ!</h1>
        <p>Здесь ничего нет, но вы уже потратили 15 секунд своей жизни.</p>
        <button class="btn-dont-click" onclick="alert('Я же просил НЕ НАЖИМАТЬ!')">НЕ НАЖИМАТЬ!</button>
    </div>

    <!-- Счетчик -->
    <div class="counter">
        Счётчик посетителей: <span class="counter-number">00042069</span>
    </div>

</body>
</html>
