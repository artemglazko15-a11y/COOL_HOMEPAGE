        /* Анимация переливания разными цветами */
        @keyframes rainbow {

        .blink-btn:hover {

        }

            background-color: #C0C0C0;
            color: #000;
            margin: 30px auto;
            width: 80%;
            max-width: 600px;
            padding: 10px;
        }
